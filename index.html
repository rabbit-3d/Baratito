<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baratito — comparador de proveedores</title>
<meta name="description" content="Comparador de precios entre proveedores">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#F6F5F0;
    --ink:#1C1B17;
    --ink-soft:#6E6C63;
    --line:#DEDBD1;
    --accent:#E8622C;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  header{ padding:48px 24px 28px; max-width:1080px; margin:0 auto; }
  .wordmark{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(32px,6vw,48px); letter-spacing:-0.02em; margin:0; }
  .wordmark span{ color:var(--accent); }
  .tagline{ margin:8px 0 0; color:var(--ink-soft); font-size:15px; }

  .toolbar{ max-width:1080px; margin:0 auto; padding:0 24px 24px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  #buscador{ flex:1; min-width:220px; padding:12px 16px; border:1.5px solid var(--line); border-radius:8px; background:#fff; font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); }
  #buscador::placeholder{ color:var(--ink-soft); }
  .estado{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); }

  .filtros{ max-width:1080px; margin:0 auto; padding:0 24px 16px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:6px 12px; border-radius:999px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer;
  }
  .chip.activo{ border-color:var(--accent); color:var(--accent); background:#fff; }

  .regla{ max-width:1080px; margin:0 auto; padding:0 24px; }
  .regla::before{
    content:''; display:block; height:14px;
    background-image:
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(90deg, var(--ink-soft) 0 1px, transparent 1px 40px);
    background-size: 100% 14px, 100% 14px;
    opacity:0.6;
  }

  main{ max-width:1080px; margin:0 auto; padding:24px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }

  .card{
    background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:16px;
    display:flex; flex-direction:column; gap:8px; transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .card .foto{
    width:100%; height:140px; object-fit:contain; border-radius:6px; background:var(--paper);
  }
  .card .foto-vacia{
    width:100%; height:140px; border-radius:6px; background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
  }
  .card .proveedor{
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent);
  }
  .card .titulo{
    font-size:13px; line-height:1.4; color:var(--ink); text-decoration:none; font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card .titulo:hover{ text-decoration:underline; }
  .precios{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .precio{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:500; }
  .precio-efectivo{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); }
  .precio-efectivo b{ color:var(--accent); }

  .vacio, .error{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); padding:24px 0; }
  .error{ color:#C13F79; }

  footer{ max-width:1080px; margin:0 auto; padding:24px 24px 60px; font-size:12px; color:var(--ink-soft); }

  @media (max-width:480px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header>
  <h1 class="wordmark">Barat<span>i</span>to</h1>
  <p class="tagline">Comparador de precios entre proveedores.</p>
</header>

<div class="toolbar">
  <input id="buscador" type="text" placeholder="Buscá un producto (ej: cubierta 29, casco, cadena)…" autocomplete="off">
  <span class="estado" id="estado">cargando…</span>
</div>
<div class="filtros" id="filtros"></div>
<div class="regla"></div>

<main id="contenido">
  <p class="vacio">Cargando productos…</p>
</main>

<footer>
  Datos públicos de los sitios de cada proveedor, guardados por un cron de GitHub Actions.
  <span id="ultima-actualizacion"></span>
</footer>

<script>
  // ==========================================================================
  // CONFIG — completar con los datos de tu proyecto de Supabase (Settings → API)
  // ==========================================================================
  const SUPABASE_URL = 'https://jcrpxrfjenjdgqtwkiyw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjcnB4cmZqZW5qZGdxdHdraXl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNzAzMDYsImV4cCI6MjA5MDg0NjMwNn0.eygcb6oGMkXRUXoJUCs_9B5yr5doF3LrQn9C1-eYHpE';

  function formatearPrecio(precio){
    return new Intl.NumberFormat('es-AR').format(Math.round(precio));
  }

  let TODOS = [];
  let PROVEEDORES_ACTIVOS = null; // null = todos

  function aplicarFiltros(){
    const q = document.getElementById('buscador').value.trim().toLowerCase();
    let filtrados = TODOS;
    if (PROVEEDORES_ACTIVOS) {
      filtrados = filtrados.filter((p) => PROVEEDORES_ACTIVOS.has(p.proveedor));
    }
    if (q) {
      filtrados = filtrados.filter((p) => p.titulo.toLowerCase().includes(q));
    }
    renderizar(filtrados);
  }

  function renderizarChips(){
    const nombres = [...new Set(TODOS.map((p) => p.proveedor))].sort();
    const contenedor = document.getElementById('filtros');

    const chipTodos = document.createElement('button');
    chipTodos.className = 'chip' + (PROVEEDORES_ACTIVOS === null ? ' activo' : '');
    chipTodos.textContent = 'Todos';
    chipTodos.onclick = () => { PROVEEDORES_ACTIVOS = null; renderizarChips(); aplicarFiltros(); };
    contenedor.innerHTML = '';
    contenedor.appendChild(chipTodos);

    for (const nombre of nombres) {
      const activo = PROVEEDORES_ACTIVOS !== null && PROVEEDORES_ACTIVOS.has(nombre);
      const chip = document.createElement('button');
      chip.className = 'chip' + (activo ? ' activo' : '');
      chip.textContent = nombre;
      chip.onclick = () => {
        const actuales = PROVEEDORES_ACTIVOS ? new Set(PROVEEDORES_ACTIVOS) : new Set();
        if (actuales.has(nombre)) actuales.delete(nombre); else actuales.add(nombre);
        PROVEEDORES_ACTIVOS = actuales.size === 0 ? null : actuales;
        renderizarChips();
        aplicarFiltros();
      };
      contenedor.appendChild(chip);
    }
  }

  async function cargarDatos(){
    const estado = document.getElementById('estado');
    const contenido = document.getElementById('contenido');

    try {
      const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        db: { schema: 'baratito' },
      });

      const [{ data: productos, error: errProductos }, { data: snapshots, error: errSnapshots }] = await Promise.all([
        client.from('productos').select('id, titulo, url, imagen_url, proveedor_id, proveedores(nombre)'),
        client.from('snapshots').select('producto_id, precio, precio_efectivo, captured_at').order('captured_at', { ascending: false }).limit(5000),
      ]);

      if (errProductos) throw errProductos;
      if (errSnapshots) throw errSnapshots;

      const ultimoPorProducto = new Map();
      for (const s of snapshots) {
        if (!ultimoPorProducto.has(s.producto_id)) ultimoPorProducto.set(s.producto_id, s);
      }

      TODOS = productos
        .map((p) => {
          const ultimo = ultimoPorProducto.get(p.id);
          if (!ultimo) return null;
          return {
            titulo: p.titulo,
            url: p.url,
            imagen_url: p.imagen_url,
            proveedor: p.proveedores?.nombre || 'Proveedor',
            precio: ultimo.precio,
            precio_efectivo: ultimo.precio_efectivo,
          };
        })
        .filter(Boolean);

      const ahora = new Date().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });
      document.getElementById('ultima-actualizacion').textContent = ` · vista generada ${ahora}`;
      estado.textContent = `${TODOS.length} productos`;

      renderizarChips();
      renderizar(TODOS);

      document.getElementById('buscador').addEventListener('input', aplicarFiltros);

    } catch (err) {
      console.error(err);
      estado.textContent = 'error';
      contenido.innerHTML = `<p class="error">No se pudo conectar a Supabase. (${err.message || err})</p>`;
    }
  }

  function renderizar(productos){
    const contenido = document.getElementById('contenido');

    if (productos.length === 0) {
      contenido.innerHTML = '<p class="vacio">Sin resultados. Probá con otro término.</p>';
      return;
    }

    const ordenados = [...productos].sort((a, b) => a.precio - b.precio);

    let html = '<div class="grid">';
    for (const p of ordenados) {
      html += `<article class="card">
        ${p.imagen_url
          ? `<img class="foto" src="${p.imagen_url}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'foto-vacia',textContent:'sin foto'}))">`
          : `<div class="foto-vacia">sin foto</div>`}
        <span class="proveedor">${p.proveedor}</span>
        <a class="titulo" href="${p.url}" target="_blank" rel="noopener">${p.titulo}</a>
        <div class="precios">
          <span class="precio">$${formatearPrecio(p.precio)}</span>
        </div>
        ${p.precio_efectivo && p.precio_efectivo < p.precio
          ? `<span class="precio-efectivo">contado/transferencia: <b>$${formatearPrecio(p.precio_efectivo)}</b></span>`
          : ''}
      </article>`;
    }
    html += '</div>';

    contenido.innerHTML = html;
  }

  cargarDatos();
</script>
</body>
</html>
