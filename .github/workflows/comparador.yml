name: Comparar precios proveedores

on:
  schedule:
    - cron: '0 */12 * * *'  # cada 12 horas (UTC) — estos precios cambian menos seguido que MELI
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install @supabase/supabase-js ws cheerio

      - run: node comparador.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
